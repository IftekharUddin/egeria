[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IftekharUddin/egeria"
authors = ["Egeria contributors"]

[workspace.dependencies]
# Internal crates. Dependency direction is enforced by review, not by cargo:
#   egeria-ir <- egeria-analysis <- egeria-compiler <- egeria-adapter-zeroclaw <- egeria-cli
#   egeria-alloy depends on egeria-ir + egeria-analysis. Nothing depends on egeria-cli.
egeria-ir = { path = "crates/egeria-ir", version = "0.1.0" }
egeria-analysis = { path = "crates/egeria-analysis", version = "0.1.0" }
egeria-compiler = { path = "crates/egeria-compiler", version = "0.1.0" }
egeria-adapter-zeroclaw = { path = "crates/egeria-adapter-zeroclaw", version = "0.1.0" }
egeria-alloy = { path = "crates/egeria-alloy", version = "0.1.0" }

# External. Versions here are floors; Cargo.lock is the real pin.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
schemars = "1"
sha2 = "0.10"
ureq = "3"

# Dev-dependencies.
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"

# The ONLY ZeroClaw crate Egeria ever links (ADR-0005). Pinned to a tag, never a branch.
# Unreferenced until issue #32; declared here so the pin is a single, reviewable line.
zeroclaw-sop-graph = { git = "https://github.com/zeroclaw-labs/zeroclaw", tag = "v0.8.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
