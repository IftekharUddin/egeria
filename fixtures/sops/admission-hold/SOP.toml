[sop]
name = "admission-hold"
description = "Production schema migration: one run at a time, concurrent triggers queued behind the approval gate rather than dropped"
version = "1.2.0"
priority = "critical"
execution_mode = "step_by_step"
cooldown_secs = 900
max_concurrent = 1
admission_policy = "hold"
max_pending_approvals = 3
agent = "release-bot"

[[triggers]]
type = "manual"

[[triggers]]
type = "channel"
channel = "slack"
alias = "ops"
condition = "$.text == \"migrate\""
